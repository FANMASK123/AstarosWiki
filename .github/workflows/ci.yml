name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 前端检查 ──────────────────────────────────
  frontend:
    name: "Frontend (lint → test → build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astaros-wiki-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: astaros-wiki-frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # ── 后端检查 ──────────────────────────────────
  backend:
    name: "Backend (checkstyle → test → build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AstarosWiki

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Checkstyle
        run: mvn checkstyle:check --batch-mode

      - name: Test
        run: mvn test --batch-mode

      - name: Package
        run: mvn package -DskipTests --batch-mode
