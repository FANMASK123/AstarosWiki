spring:
  datasource:
    url: jdbc:mysql://localhost:3306/astaros_wiki?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: astaros_wiki
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      password: 你的Redis密码
      database: 0
      timeout: 5000ms

server:
  port: 8801

jwt:
  secret: 更换为生产环境的安全密钥
  expiration: 86400000

knife4j:
  enable: false