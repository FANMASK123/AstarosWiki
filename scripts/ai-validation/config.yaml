{
  "mode": "mock",
  "models": {
    "glm": {
      "provider": "alibaba-coding-plan",
      "model": "glm-5.2",
      "api_key_env": "AI_GLM_KEY",
      "url_env": "AI_GLM_URL"
    },
    "kimi": {
      "provider": "kimi-coding-cn",
      "model": "kimi-k2.7-code",
      "api_key_env": "AI_KIMI_KEY",
      "url_env": "AI_KIMI_URL"
    },
    "deepseek": {
      "provider": "deepseek",
      "model": "deepseek-v4-pro",
      "api_key_env": "AI_DEEPSEEK_KEY",
      "url_env": "AI_DEEPSEEK_URL"
    }
  },
  "harness": {
    "max_iter": 3,
    "threshold": 7.5,
    "planner_max_input_tokens": 32000,
    "generator_max_output_tokens": 4000
  }
}